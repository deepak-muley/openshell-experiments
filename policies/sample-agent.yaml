# Policy for samples/probe-agent.
# curl may GET https://example.com. Every other destination stays denied.
# Writes are limited to /sandbox and /tmp.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /proc
    - /dev/urandom
    - /etc
    - /app
    - /opt
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

# best_effort does not skip the runtime's Landlock ABI v3 probe.
# Linux 6.2+ with CONFIG_SECURITY_LANDLOCK is still required.
landlock:
  compatibility: best_effort

network_policies:
  example_com:
    name: example-com-readonly
    endpoints:
      - host: example.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/curl
