# Filesystem baseline for sandbox workloads on Kubernetes.
# Network rules come from an attached provider profile, or from
# policies/sample-agent.yaml when the process is the probe agent.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /proc
    - /dev/urandom
    - /etc
    - /app
    - /opt
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort
