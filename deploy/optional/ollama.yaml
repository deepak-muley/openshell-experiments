# Optional open-weights model inside the same cluster as OpenShell.
# Apply on its own. make demo does not start this.
# After the pod is Ready, pull a small model once:
#   kubectl -n models exec deploy/ollama -- ollama pull qwen2.5:0.5b
apiVersion: v1
kind: Namespace
metadata:
  name: models
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: models
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.11.4
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              memory: 6Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: models
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
