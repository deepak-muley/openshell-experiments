# Lab profile for the NVIDIA API catalog, including Nemotron and other open models
# served at integrate.api.nvidia.com. The sandbox selects the model id in the
# request body. OpenShell does not rewrite the model.
id: lab-nvidia
display_name: Lab NVIDIA
description: NVIDIA integrate API for the OpenShell Kubernetes lab
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: NVIDIA API key
    env_vars: [NVIDIA_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/curl
  - /usr/local/bin/curl
  - /usr/local/bin/python
  - /usr/local/bin/python3
